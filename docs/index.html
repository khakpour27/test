<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b7285">
<title>Ciclovia del Navile - Bike Navigation</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root { --accent:#0b7285; --bg:#0b7285; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  #map { position:absolute; inset:0; }
  .bar {
    position:absolute; top:0; left:0; right:0; z-index:1000;
    background:var(--bg); color:#fff; padding:10px 14px;
    display:flex; align-items:center; gap:10px;
    box-shadow:0 1px 6px rgba(0,0,0,.3);
  }
  .bar h1 { font-size:15px; margin:0; font-weight:600; flex:1; line-height:1.2; }
  .bar small { display:block; font-weight:400; opacity:.85; font-size:11px; }
  .bar a { color:#fff; text-decoration:none; background:rgba(255,255,255,.18);
    padding:6px 10px; border-radius:8px; font-size:12px; white-space:nowrap; }
  .fab {
    position:absolute; z-index:1000; right:14px; bottom:26px;
    width:56px; height:56px; border-radius:50%; border:none;
    background:var(--accent); color:#fff; font-size:24px;
    box-shadow:0 2px 10px rgba(0,0,0,.35); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .fab.follow { background:#e8590c; }
  #status {
    position:absolute; z-index:1000; left:14px; bottom:30px;
    background:rgba(255,255,255,.94); color:#222; padding:8px 12px;
    border-radius:10px; font-size:13px; max-width:60%;
    box-shadow:0 1px 6px rgba(0,0,0,.25); display:none;
  }
  .me-dot {
    width:18px; height:18px; background:#1c7ed6; border:3px solid #fff;
    border-radius:50%; box-shadow:0 0 0 2px rgba(28,126,214,.4);
  }
  .leaflet-popup-content { font-size:13px; line-height:1.4; }
  .leaflet-popup-content b { color:var(--accent); }
  .num { display:inline-block; min-width:20px; height:20px; line-height:20px;
    text-align:center; background:var(--accent); color:#fff; border-radius:50%;
    font-size:11px; margin-right:6px; }
</style>
</head>
<body>
<div class="bar">
  <h1>Ciclovia del Navile<small>Bologna &rarr; Malalbergo &middot; ~30 km &middot; mostly flat</small></h1>
  <a href="navile.gpx" download>&#8681; GPX</a>
</div>
<div id="map"></div>
<div id="status"></div>
<button class="fab" id="locate" title="Show my location">&#9678;</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="data.js"></script>
<script>
(function () {
  var D = window.NAVILE;
  var map = L.map('map', { zoomControl:true }).setView([44.585, 11.40], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // Route line
  var line = L.polyline(D.track, { color:'#0b7285', weight:5, opacity:.85 }).addTo(map);
  map.fitBounds(line.getBounds(), { padding:[30,30] });

  // POI markers
  D.pois.forEach(function (p, i) {
    var start = i === 0, end = i === D.pois.length - 1;
    var color = start ? '#2b8a3e' : end ? '#c92a2a' : '#0b7285';
    var m = L.circleMarker([p.lat, p.lon], {
      radius: start || end ? 9 : 7, color:'#fff', weight:2,
      fillColor: color, fillOpacity:1
    }).addTo(map);
    m.bindPopup('<b><span class="num">' + (i+1) + '</span>' + p.name + '</b><br>' + p.desc +
      '<br><a href="https://www.google.com/maps/dir/?api=1&destination=' +
      p.lat + ',' + p.lon + '&travelmode=bicycling" target="_blank" rel="noopener">Directions to here &rarr;</a>');
  });

  // --- Live location ---
  var meDot = null, meAcc = null, following = false, watchId = null;
  var status = document.getElementById('status');
  var locateBtn = document.getElementById('locate');
  var meIcon = L.divIcon({ className:'', html:'<div class="me-dot"></div>', iconSize:[18,18] });

  function toRad(x){ return x*Math.PI/180; }
  function distM(a,b){ // haversine metres
    var R=6371000, dLat=toRad(b[0]-a[0]), dLon=toRad(b[1]-a[1]);
    var s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toRad(a[0]))*Math.cos(toRad(b[0]))*Math.sin(dLon/2)*Math.sin(dLon/2);
    return 2*R*Math.asin(Math.sqrt(s));
  }
  function nextPoi(pos){
    var best=null, bd=Infinity;
    D.pois.forEach(function(p){ var d=distM(pos,[p.lat,p.lon]); if(d<bd){bd=d; best=p;} });
    return { poi:best, d:bd };
  }
  function fmt(m){ return m>=1000 ? (m/1000).toFixed(1)+' km' : Math.round(m)+' m'; }

  function onPos(e){
    var ll = [e.coords.latitude, e.coords.longitude];
    if(!meDot){
      meDot = L.marker(ll,{icon:meIcon, zIndexOffset:1000}).addTo(map);
      meAcc = L.circle(ll,{radius:e.coords.accuracy, color:'#1c7ed6', weight:1, fillOpacity:.08}).addTo(map);
    } else { meDot.setLatLng(ll); meAcc.setLatLng(ll).setRadius(e.coords.accuracy); }
    if(following) map.setView(ll, Math.max(map.getZoom(),16), {animate:true});
    var n = nextPoi(ll);
    status.style.display='block';
    status.innerHTML = 'Nearest point: <b>'+n.poi.name+'</b><br>'+fmt(n.d)+' away';
  }
  function onErr(err){
    status.style.display='block';
    status.textContent = 'Location unavailable: ' + err.message;
  }
  locateBtn.addEventListener('click', function(){
    if(!('geolocation' in navigator)){ status.style.display='block'; status.textContent='Geolocation not supported on this device.'; return; }
    if(watchId===null){
      watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy:true, maximumAge:2000, timeout:15000 });
    }
    following = !following;
    locateBtn.classList.toggle('follow', following);
    locateBtn.innerHTML = following ? '&#10148;' : '&#9678;';
    if(following && meDot) map.setView(meDot.getLatLng(), Math.max(map.getZoom(),16));
  });
  // stop auto-following when user drags the map
  map.on('dragstart', function(){ if(following){ following=false; locateBtn.classList.remove('follow'); locateBtn.innerHTML='&#9678;'; }});
})();
</script>
</body>
</html>
