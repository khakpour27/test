<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b7285">
<title>Ciclovia del Navile - Bike Navigation</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root { --accent:#0b7285; --bg:#0b7285; --attr:#e8590c; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  #map { position:absolute; inset:0; }
  .leaflet-top { top:52px; }
  .leaflet-control-layers { font-size:13px; border-radius:10px; box-shadow:0 1px 6px rgba(0,0,0,.25); }
  .leaflet-control-layers-list { padding:4px 8px; }
  .leaflet-control-layers label { display:flex; align-items:center; gap:6px; margin:2px 0; cursor:pointer; }
  .bar {
    position:absolute; top:0; left:0; right:0; z-index:1000;
    background:var(--bg); color:#fff; padding:10px 14px;
    display:flex; align-items:center; gap:10px; box-shadow:0 1px 6px rgba(0,0,0,.3);
  }
  .bar h1 { font-size:15px; margin:0; font-weight:600; flex:1; line-height:1.2; }
  .bar small { display:block; font-weight:400; opacity:.85; font-size:11px; }
  .bar button.gpx { color:#fff; background:rgba(255,255,255,.18); border:none;
    padding:7px 11px; border-radius:8px; font-size:12px; white-space:nowrap; cursor:pointer; font-family:inherit; }
  .fab {
    position:absolute; z-index:1002; right:14px; bottom:26px;
    width:56px; height:56px; border-radius:50%; border:none;
    background:var(--accent); color:#fff; font-size:24px;
    box-shadow:0 2px 10px rgba(0,0,0,.35); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .fab.follow { background:#e8590c; }
  .fab.mini { width:46px; height:46px; font-size:20px; bottom:90px; right:19px; background:#495057; }
  .fab.mini.on { background:#2b8a3e; }
  #status {
    position:absolute; z-index:1000; left:14px; bottom:30px;
    background:rgba(255,255,255,.94); color:#222; padding:8px 12px;
    border-radius:10px; font-size:13px; max-width:60%;
    box-shadow:0 1px 6px rgba(0,0,0,.25); display:none;
  }
  #banner {
    position:absolute; z-index:1000; left:50%; transform:translateX(-50%);
    top:100px; background:rgba(20,20,20,.86); color:#fff; padding:7px 13px;
    border-radius:20px; font-size:12.5px; display:none; align-items:center; gap:8px;
    box-shadow:0 2px 10px rgba(0,0,0,.3); max-width:90%;
  }
  #banner .spin { width:13px; height:13px; border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff; border-radius:50%; animation:sp .8s linear infinite; flex:none; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .me-dot { width:18px; height:18px; background:#1c7ed6; border:3px solid #fff;
    border-radius:50%; box-shadow:0 0 0 2px rgba(28,126,214,.4); }
  .attr-pin { width:24px; height:24px; background:var(--attr); border:2px solid #fff;
    border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    box-shadow:0 1px 4px rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; }
  .attr-pin span { transform:rotate(45deg); color:#fff; font-size:12px; line-height:1; }
  .leaflet-popup-content { font-size:13px; line-height:1.45; }
  .leaflet-popup-content b { color:var(--accent); }
  .leaflet-popup-content .tag { display:inline-block; font-size:10px; text-transform:uppercase;
    letter-spacing:.06em; font-weight:700; padding:1px 6px; border-radius:6px; margin-bottom:4px; }
  .tag.attr { background:#fde3d1; color:#b34700; }
  .tag.stop { background:#d3f0ee; color:#0b6b73; }
  #nav { position:absolute; z-index:1001; top:52px; left:0; right:0; margin:8px 10px;
    background:var(--accent); color:#fff; border-radius:14px; padding:10px 12px;
    display:none; gap:12px; align-items:center; box-shadow:0 3px 12px rgba(0,0,0,.35); }
  #nav.show { display:flex; }
  #nav.off { background:#b3261e; }
  #nav .icon { font-size:30px; width:38px; text-align:center; flex:none; line-height:1; }
  #nav .txt { flex:1; min-width:0; }
  #nav .instr { font-size:14px; font-weight:600; line-height:1.2; }
  #nav .dist { font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  #nav .sub { font-size:11.5px; opacity:.92; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #elev { position:absolute; z-index:1001; left:10px; right:10px; bottom:calc(14px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.96); border-radius:14px; padding:8px 12px 10px;
    box-shadow:0 3px 14px rgba(0,0,0,.28); display:none; }
  #elev.show { display:block; }
  .elevhead { display:flex; align-items:center; gap:8px; font-size:12px; color:#333; }
  .elevhead b { color:var(--accent); }
  .elevhead span { flex:1; color:#666; font-size:11.5px; font-variant-numeric:tabular-nums; }
  .elevhead button { border:none; background:#eee; width:24px; height:24px; border-radius:50%; font-size:16px; cursor:pointer; color:#333; }
  #elevChart { margin-top:6px; font-size:12px; color:#888; }
  #elevChart svg { display:block; width:100%; height:88px; }
</style>
</head>
<body>
<div class="bar">
  <h1>Ciclovia del Navile<small>Casalecchio di Reno &rarr; Bologna &rarr; Malalbergo</small></h1>
  <button class="gpx" id="elevBtn" title="Elevation profile">&#9968;</button>
  <button class="gpx" id="gpx">&#8681; GPX</button>
</div>
<div id="map"></div>
<div id="nav">
  <div class="icon" id="navIcon">&#8593;</div>
  <div class="txt">
    <div class="dist" id="navDist">&mdash;</div>
    <div class="instr" id="navInstr">Start navigation</div>
    <div class="sub" id="navSub"></div>
  </div>
</div>
<div id="banner"></div>
<div id="elev">
  <div class="elevhead"><b>Elevation</b><span id="elevStats"></span><button id="elevClose" aria-label="Close">&times;</button></div>
  <div id="elevChart">Loading…</div>
</div>
<div id="status"></div>
<button class="fab mini" id="voice" title="Voice guidance">&#128264;</button>
<button class="fab" id="locate" title="Start / follow my location">&#9678;</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="data.js"></script>
<script>
(function () {
  var D = window.NAVILE;
  var map = L.map('map', { zoomControl:true }).setView([44.56, 11.33], 11);
  var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19, attribution:'&copy; OpenStreetMap contributors' }).addTo(map);
  var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom:19, attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics' });
  var labels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom:19 });
  L.control.layers({ 'Map':osm, 'Satellite':L.layerGroup([sat,labels]) }, null, { position:'topright', collapsed:false }).addTo(map);

  var banner = document.getElementById('banner');
  function showBanner(html, spin){ banner.style.display='flex'; banner.innerHTML=(spin?'<span class="spin"></span>':'')+'<span>'+html+'</span>'; }
  function hideBanner(){ banner.style.display='none'; }

  function toRad(x){ return x*Math.PI/180; }
  function distM(a,b){ var R=6371000,dLa=toRad(b[0]-a[0]),dLo=toRad(b[1]-a[1]);
    var s=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(toRad(a[0]))*Math.cos(toRad(b[0]))*Math.sin(dLo/2)*Math.sin(dLo/2);
    return 2*R*Math.asin(Math.sqrt(s)); }

  // ---- fallback line (replaced once the real geometry loads) ----
  var routeCoords = D.track.slice();
  var line = L.polyline(routeCoords, { color:'#0b7285', weight:5, opacity:.45, dashArray:'6 8' }).addTo(map);
  map.fitBounds(line.getBounds(), { padding:[36,36] });

  function popupLink(lat, lon){
    return '<a href="https://www.google.com/maps/dir/?api=1&destination='+lat+','+lon+
           '&travelmode=bicycling" target="_blank" rel="noopener">Directions to here &rarr;</a>';
  }

  // ---- Markers ----
  var start = D.start;
  var startMk = L.marker([start.lat, start.lon], { icon: L.divIcon({ className:'', iconSize:[22,22],
    html:'<div style="width:20px;height:20px;background:#2b8a3e;border:3px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>' }) }).addTo(map);
  function bindStart(){ startMk.bindPopup('<span class="tag stop">Start</span><br><b>'+start.name.replace('Start · ','')+'</b><br>'+start.desc+'<br>'+popupLink(start.lat,start.lon)); }
  bindStart();

  var poiMarks = D.pois.map(function(p,i){
    var end = i===D.pois.length-1;
    var mk = L.circleMarker([p.lat,p.lon], { radius:end?9:7, color:'#fff', weight:2, fillColor:end?'#c92a2a':'#0b7285', fillOpacity:1 }).addTo(map);
    bindPoi(mk,p,i); return mk;
  });
  function bindPoi(mk,p,i){ var end=i===D.pois.length-1;
    mk.bindPopup('<span class="tag stop">'+(end?'Finish':'Stop '+(i+1))+'</span><br><b>'+p.name+'</b><br>'+p.desc+'<br>'+popupLink(p.lat,p.lon)); }

  var attrMarks = D.attractions.map(function(a){
    var mk = L.marker([a.lat,a.lon], { icon: L.divIcon({ className:'', iconSize:[24,24], iconAnchor:[12,22],
      html:'<div class="attr-pin"><span>&#9733;</span></div>' }) }).addTo(map);
    bindAttr(mk,a); return mk;
  });
  function bindAttr(mk,a){ mk.bindPopup('<span class="tag attr">Attraction</span><br><b>'+a.name+'</b><br>'+a.desc+'<br>'+popupLink(a.lat,a.lon)); }

  // ---- Geocoding (Nominatim) with localStorage cache ----
  function cacheGet(q){ try{ var v=localStorage.getItem('nav_geo_'+q); return v?JSON.parse(v):null; }catch(e){ return null; } }
  function cacheSet(q,ll){ try{ localStorage.setItem('nav_geo_'+q, JSON.stringify(ll)); }catch(e){} }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
  function geocode(q){
    var c=cacheGet(q); if(c) return Promise.resolve(c);
    return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q))
      .then(function(r){ return r.ok?r.json():[]; })
      .then(function(a){ if(a&&a[0]){ var ll=[parseFloat(a[0].lat),parseFloat(a[0].lon)]; cacheSet(q,ll); return ll; } return null; })
      .catch(function(){ return null; });
  }

  (async function resolveAll(){
    // Start first (feeds routing), then build the route, then resolve stops + attractions.
    var s = await geocode(start.query);
    if(s){ start.lat=s[0]; start.lon=s[1]; startMk.setLatLng(s); bindStart(); routeCoords[0]=s; line.setLatLngs(routeCoords); }
    buildRoute();
    updateStops();
    var items = D.pois.map(function(p,i){ return {o:p, mk:poiMarks[i], reb:function(){ bindPoi(poiMarks[i],p,i); }}; })
      .concat(D.attractions.map(function(a,i){ return {o:a, mk:attrMarks[i], reb:function(){ bindAttr(attrMarks[i],a); }}; }));
    for(var k=0;k<items.length;k++){
      var it=items[k], cached=cacheGet(it.o.query);
      var ll = cached || await geocode(it.o.query);
      if(ll){ it.o.lat=ll[0]; it.o.lon=ll[1]; it.mk.setLatLng(ll); it.reb(); updateStops(); }
      if(!cached) await sleep(1100); // be polite to Nominatim on first load only
    }
  })();

  // ---- Real canal geometry from OpenStreetMap (Overpass) ----
  function fetchCanal(){
    var q = '[out:json][timeout:25];way["waterway"="canal"]["name"~"Navile"](44.44,11.25,44.75,11.56);out geom;';
    var url = 'https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q);
    return fetch(url).then(function(r){ return r.ok?r.json():null; })
      .then(function(j){
        if(!j||!j.elements) return null;
        var segs = j.elements.filter(function(e){ return e.geometry&&e.geometry.length>1; })
          .map(function(e){ return e.geometry.map(function(g){ return [g.lat,g.lon]; }); });
        return segs.length ? trimCanal(chainSegs(segs)) : null;
      }).catch(function(){ return null; });
  }
  function chainSegs(segs){
    segs = segs.slice(); var chain = segs.shift().slice(), moved=true;
    while(segs.length && moved){
      moved=false; var head=chain[0], tail=chain[chain.length-1], best=null;
      for(var i=0;i<segs.length;i++){ var s=segs[i], a=s[0], b=s[s.length-1];
        [ {g:distM(tail,a),w:'t',rev:false,i:i}, {g:distM(tail,b),w:'t',rev:true,i:i},
          {g:distM(head,b),w:'h',rev:false,i:i}, {g:distM(head,a),w:'h',rev:true,i:i} ]
          .forEach(function(c){ if(!best||c.g<best.g) best=c; }); }
      if(best && best.g<900){ var s=segs.splice(best.i,1)[0]; var seg=best.rev?s.slice().reverse():s.slice();
        chain = best.w==='t' ? chain.concat(seg) : seg.concat(chain); moved=true; }
    }
    return chain;
  }
  function nearestIdx(P,pt){ var bi=0,bd=Infinity; for(var i=0;i<P.length;i++){ var d=distM(P[i],pt); if(d<bd){bd=d;bi=i;} } return bi; }
  function trimCanal(P){
    if(P.length<5) return null;
    var pg=[D.pois[0].lat,D.pois[0].lon], mb=[D.pois[D.pois.length-1].lat,D.pois[D.pois.length-1].lon];
    var i=nearestIdx(P,pg), j=nearestIdx(P,mb);
    var seg = i<=j ? P.slice(i,j+1) : P.slice(j,i+1).reverse();
    return seg.length>=5 ? seg : null;
  }
  function downsample(seg,n){ if(seg.length<=n) return seg; var out=[],step=(seg.length-1)/(n-1);
    for(var k=0;k<n;k++) out.push(seg[Math.round(k*step)]); return out; }

  // ---- BRouter: snap a set of vias to real bike paths ----
  function brouterURL(vias, profile){
    var ll = vias.map(function(p){ return p[1]+','+p[0]; }).join('|');
    return 'https://brouter.de/brouter?lonlats='+ll+'&profile='+profile+'&alternativeidx=0&format=geojson';
  }
  function brouter(vias, profiles, i){
    i=i||0; if(i>=profiles.length) return Promise.resolve(null);
    return fetch(brouterURL(vias,profiles[i])).then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(gj){ var f=gj.features&&gj.features[0], c=f&&f.geometry&&f.geometry.coordinates;
        if(!c||!c.length) throw 0;
        return { coords:c.map(function(p){ return [p[1],p[0]]; }),
                 km:f.properties&&f.properties['track-length']?(f.properties['track-length']/1000).toFixed(1):null }; })
      .catch(function(){ return brouter(vias,profiles,i+1); });
  }
  function applyRoute(coords){ routeCoords=coords; line.setLatLngs(coords);
    line.setStyle({ opacity:.9, dashArray:null, weight:5 }); map.fitBounds(line.getBounds(),{padding:[36,36]});
    computeMeta(); updateStops(); buildElevation(coords); }

  // ---- Elevation profile (Open-Meteo, sampled along the route) ----
  var elevData=null;
  function buildElevation(coords){
    if(!coords || coords.length<2) return;
    var pts=downsample(coords,100), xs=[0];
    for(var i=1;i<pts.length;i++) xs.push(xs[i-1]+distM(pts[i-1],pts[i]));
    var lat=pts.map(function(p){ return p[0].toFixed(5); }).join(',');
    var lon=pts.map(function(p){ return p[1].toFixed(5); }).join(',');
    fetch('https://api.open-meteo.com/v1/elevation?latitude='+lat+'&longitude='+lon)
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(j){ if(!j||!j.elevation||!j.elevation.length) return;
        elevData={ xs:xs, ele:j.elevation, totalX:xs[xs.length-1]||1 };
        if(document.getElementById('elev').classList.contains('show')) renderElev(); })
      .catch(function(){});
  }
  function renderElev(){
    var box=document.getElementById('elevChart'), stats=document.getElementById('elevStats');
    if(!elevData){ box.textContent='Elevation data unavailable on this network.'; stats.textContent=''; return; }
    var e=elevData.ele, xs=elevData.xs, tot=elevData.totalX;
    var mn=Math.min.apply(null,e), mx=Math.max.apply(null,e), rng=Math.max(1,mx-mn), W=1000,H=100,pad=6;
    var asc=0,desc=0; for(var i=1;i<e.length;i++){ var d=e[i]-e[i-1]; if(d>0)asc+=d; else desc-=d; }
    function X(i){ return pad+(xs[i]/tot)*(W-2*pad); }
    function Y(v){ return H-pad-((v-mn)/rng)*(H-2*pad); }
    var path='M '+X(0).toFixed(1)+' '+Y(e[0]).toFixed(1);
    for(var k=1;k<e.length;k++) path+=' L '+X(k).toFixed(1)+' '+Y(e[k]).toFixed(1);
    var area=path+' L '+X(e.length-1).toFixed(1)+' '+(H-pad)+' L '+X(0).toFixed(1)+' '+(H-pad)+' Z';
    box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
      '<path d="'+area+'" fill="rgba(11,114,133,.18)"/>'+
      '<path d="'+path+'" fill="none" stroke="#0b7285" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>';
    stats.textContent='↑ '+Math.round(asc)+' m  ↓ '+Math.round(desc)+' m  ·  '+Math.round(mn)+'–'+Math.round(mx)+' m  ·  '+(tot/1000).toFixed(1)+' km';
  }
  document.getElementById('elevBtn').addEventListener('click', function(){
    var el=document.getElementById('elev'), show=!el.classList.contains('show');
    el.classList.toggle('show',show);
    if(show){ if(!elevData){ document.getElementById('elevChart').textContent='Loading…'; buildElevation(routeCoords); } else renderElev(); }
  });
  document.getElementById('elevClose').addEventListener('click', function(){ document.getElementById('elev').classList.remove('show'); });

  // ---- OSRM cycling router (returns turn steps WITH street names) ----
  function osrmRoute(vias){
    var coords = vias.map(function(p){ return p[1]+','+p[0]; }).join(';');
    var url = 'https://routing.openstreetmap.de/routed-bike/route/v1/driving/'+coords+
              '?overview=full&geometries=geojson&steps=true&continue_straight=true';
    return fetch(url).then(function(r){ return r.ok?r.json():null; }).then(function(j){
      if(!j||j.code!=='Ok'||!j.routes||!j.routes.length) return null;
      var rt=j.routes[0], steps=[];
      (rt.legs||[]).forEach(function(l){ (l.steps||[]).forEach(function(s){ steps.push(s); }); });
      return { coords: rt.geometry.coordinates.map(function(c){ return [c[1],c[0]]; }),
               steps: steps, km: (rt.distance/1000).toFixed(1) };
    }).catch(function(){ return null; });
  }
  function arrowFor(mod){
    switch(mod){ case 'left': return '&#8592;'; case 'right': return '&#8594;';
      case 'slight left': return '&#8598;'; case 'slight right': return '&#8599;';
      case 'sharp left': return '&#8601;'; case 'sharp right': return '&#8600;';
      case 'uturn': return '&#8617;'; default: return '&#8593;'; }
  }
  function osrmText(m, name, isLast){
    if(isLast || m.type==='arrive') return 'Arrive at Malalbergo';
    if(m.type==='depart') return 'Start the ride'+(name?' on '+name:'');
    var verb;
    switch(m.modifier){
      case 'left': verb='Turn left'; break; case 'right': verb='Turn right'; break;
      case 'slight left': verb='Bear left'; break; case 'slight right': verb='Bear right'; break;
      case 'sharp left': verb='Sharp left'; break; case 'sharp right': verb='Sharp right'; break;
      case 'uturn': verb='Make a U-turn'; break; default: verb='Continue';
    }
    if(m.type==='roundabout'||m.type==='rotary') verb='Take the roundabout';
    return verb + (name ? ' onto '+name : '');
  }
  function setManeuversFromOSRM(steps){
    var out=[], last=-1e9;
    for(var i=0;i<steps.length;i++){
      var s=steps[i], m=s.maneuver||{}, isFirst=(i===0), isLast=(i===steps.length-1);
      if(m.type==='depart' && !isFirst) continue;
      if((m.type==='arrive'||m.type==='waypoint') && !isLast) continue;
      if(!m.location) continue;
      var v=nearestVertex([m.location[1], m.location[0]]), dist=cum[v.i];
      var txt=osrmText(m, s.name||'', isLast); if(!txt) continue;
      if(isLast || dist-last>25){ out.push({ dist:dist, icon:arrowFor(m.modifier||(m.type==='arrive'?'':'straight')), text:txt }); last=dist; }
    }
    if(!out.length || out[out.length-1].dist < totalLen-5) out.push({ dist:totalLen, icon:'&#9873;', text:'Arrive at Malalbergo' });
    out[out.length-1].icon='&#9873;';
    maneuvers=out; resetVoice();
  }

  // ---- Turn-by-turn metadata derived from the route geometry ----
  var cum=[], totalLen=0, maneuvers=[], stopProj=[];
  function bearing(a,b){ var y=Math.sin(toRad(b[1]-a[1]))*Math.cos(toRad(b[0]));
    var x=Math.cos(toRad(a[0]))*Math.sin(toRad(b[0]))-Math.sin(toRad(a[0]))*Math.cos(toRad(b[0]))*Math.cos(toRad(b[1]-a[1]));
    return (Math.atan2(y,x)*180/Math.PI+360)%360; }
  function angDiff(b1,b2){ return ((b2-b1+540)%360)-180; } // + = right, - = left
  function maneuver(turn){
    var a=Math.abs(turn), dir=turn>0?'right':'left';
    if(a<25) return {icon:'&#8593;', text:'Continue'};
    if(a<50) return {icon:turn>0?'&#8599;':'&#8598;', text:'Bear '+dir};
    if(a<115) return {icon:turn>0?'&#8594;':'&#8592;', text:'Turn '+dir};
    return {icon:turn>0?'&#8600;':'&#8601;', text:'Sharp '+dir};
  }
  function computeMeta(){
    var R=routeCoords; cum=[0]; for(var i=1;i<R.length;i++) cum[i]=cum[i-1]+distM(R[i-1],R[i]);
    totalLen=cum[cum.length-1]||0; maneuvers=[];
    var lastDist=-1e9;
    for(var j=1;j<R.length-1;j++){
      var t=angDiff(bearing(R[j-1],R[j]), bearing(R[j],R[j+1]));
      if(Math.abs(t)>=28 && cum[j]-lastDist>40){ var m=maneuver(t); maneuvers.push({dist:cum[j], icon:m.icon, text:m.text}); lastDist=cum[j]; }
    }
    maneuvers.push({dist:totalLen, icon:'&#9873;', text:'Arrive at Malalbergo'});
    resetVoice();
  }
  function nearestVertex(pos){ var bi=0,bd=Infinity, R=routeCoords;
    for(var i=0;i<R.length;i++){ var d=distM(pos,R[i]); if(d<bd){bd=d;bi=i;} } return {i:bi,d:bd}; }
  function updateStops(){
    if(!routeCoords.length||!cum.length) return;
    stopProj = [start].concat(D.pois).map(function(p){ var v=nearestVertex([p.lat,p.lon]);
      return { name:(p.name||'').replace('Start · ',''), cum:cum[v.i] }; })
      .sort(function(a,b){ return a.cum-b.cum; });
  }
  computeMeta();

  async function buildRoute(){
    showBanner('Finding the canal bike route with turn-by-turn…', true);
    var canal = await fetchCanal();
    var vias;
    if(canal){ vias=[[start.lat,start.lon]].concat(downsample(canal,10)); }
    else { var t=D.track, v=[[start.lat,start.lon]]; for(var x=2;x<t.length;x+=2) v.push(t[x]); v.push(t[t.length-1]); vias=v; }
    // Prefer OSRM (named-street turn instructions); fall back to BRouter (geometry only).
    var osrm = await osrmRoute(vias);
    if(osrm){ applyRoute(osrm.coords); setManeuversFromOSRM(osrm.steps);
      showBanner((canal?'On the canal bike path':'On bike paths (canal data unavailable)')+' · turn-by-turn'+(osrm.km?' · '+osrm.km+' km':''), false);
      setTimeout(hideBanner, 5000); return; }
    var res = await brouter(vias, ['trekking','gravel','fastbike']);
    if(res){ applyRoute(res.coords);
      showBanner((canal?'Snapped to the canal path':'Routed on bike paths')+' · basic guidance'+(res.km?' · '+res.km+' km':''), false);
      setTimeout(hideBanner, 5000); return; }
    if(canal){ applyRoute([[start.lat,start.lon]].concat(canal));
      showBanner('Traced along the Navile canal (couldn’t snap to paths)', false); setTimeout(hideBanner,6000); return; }
    showBanner('Showing an approximate line - map services unreachable. The GPX still works in OsmAnd/Komoot.', false);
    setTimeout(hideBanner, 7000);
  }

  // ---- GPX export ----
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function buildGPX(){
    var g='<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Ciclovia del Navile" xmlns="http://www.topografix.com/GPX/1/1">\n<metadata><name>Ciclovia del Navile</name></metadata>\n';
    g+='<wpt lat="'+start.lat+'" lon="'+start.lon+'"><name>'+esc(start.name)+'</name><desc>'+esc(start.desc)+'</desc></wpt>\n';
    D.pois.forEach(function(p){ g+='<wpt lat="'+p.lat+'" lon="'+p.lon+'"><name>'+esc(p.name)+'</name><desc>'+esc(p.desc)+'</desc></wpt>\n'; });
    D.attractions.forEach(function(a){ g+='<wpt lat="'+a.lat+'" lon="'+a.lon+'"><name>'+esc(a.name)+'</name><desc>'+esc(a.desc)+'</desc><sym>Tourist Info</sym></wpt>\n'; });
    g+='<trk><name>Ciclovia del Navile</name><trkseg>\n';
    routeCoords.forEach(function(c){ g+='<trkpt lat="'+c[0]+'" lon="'+c[1]+'"></trkpt>\n'; });
    g+='</trkseg></trk>\n</gpx>\n'; return g;
  }
  document.getElementById('gpx').addEventListener('click', function(){
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([buildGPX()],{type:'application/gpx+xml'}));
    a.download='navile.gpx'; document.body.appendChild(a); a.click(); a.remove();
  });

  // ---- Live location + turn-by-turn ----
  var meDot=null, meAcc=null, following=false, watchId=null;
  var locateBtn=document.getElementById('locate');
  var nav=document.getElementById('nav');
  var navIcon=document.getElementById('navIcon'), navInstr=document.getElementById('navInstr'),
      navDist=document.getElementById('navDist'), navSub=document.getElementById('navSub');
  var meIcon=L.divIcon({ className:'', html:'<div class="me-dot"></div>', iconSize:[18,18] });
  var SPEED_KMH=15, nextTurnDist=null;

  // ---- Keep the screen awake while navigating ----
  var wakeLock=null;
  async function acquireWake(){ try{ if('wakeLock' in navigator && document.visibilityState==='visible'){ wakeLock=await navigator.wakeLock.request('screen'); } }catch(e){} }
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible' && watchId!==null) acquireWake(); });

  // ---- Zoom tighter as a turn approaches ----
  function navZoom(){ var d=nextTurnDist; if(d==null) return 16; return d<90?18:d<250?17:d<600?16:15; }

  // ---- Voice guidance (Web Speech) ----
  var voiceOn=false, preSpoken, finSpoken;
  function resetVoice(){ preSpoken=new Set(); finSpoken=new Set(); }
  resetVoice();
  function speak(txt){ if(!voiceOn||!('speechSynthesis' in window)) return;
    try{ var u=new SpeechSynthesisUtterance(txt); u.lang='en-GB'; u.rate=1; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); }catch(e){} }
  var voiceBtn=document.getElementById('voice');
  voiceBtn.addEventListener('click', function(){
    voiceOn=!voiceOn; voiceBtn.classList.toggle('on',voiceOn); voiceBtn.innerHTML=voiceOn?'&#128266;':'&#128264;';
    if(voiceOn) speak('Voice guidance on'); else if('speechSynthesis' in window) window.speechSynthesis.cancel();
  });
  function fmt(m){ return m>=1000 ? (m/1000).toFixed(m<10000?2:1).replace(/0$/,'')+' km' : Math.round(m/10)*10+' m'; }
  function setControlsTop(px){ var t=document.querySelector('.leaflet-top'); if(t) t.style.top=px+'px'; }

  function updateNav(pos, acc){
    if(!routeCoords.length||!cum.length){ return; }
    var v=nearestVertex(pos), travelled=cum[v.i], remaining=Math.max(0, totalLen-travelled);
    nav.classList.add('show'); setControlsTop(118);
    if(v.d>70){ // off the route
      nextTurnDist=null;
      nav.classList.add('off'); navIcon.innerHTML='&#9888;';
      navDist.textContent=fmt(v.d); navInstr.textContent='Off route — head back to the path';
      navSub.textContent=fmt(remaining)+' to go along the route'; return;
    }
    nav.classList.remove('off');
    var nm=null, nmIdx=-1; for(var i=0;i<maneuvers.length;i++){ if(maneuvers[i].dist>travelled+8){ nm=maneuvers[i]; nmIdx=i; break; } }
    if(!nm){ nm=maneuvers[maneuvers.length-1]; nmIdx=maneuvers.length-1; }
    var dNext=Math.max(0, nm.dist-travelled); nextTurnDist=dNext;
    navIcon.innerHTML=nm.icon; navDist.textContent=fmt(dNext); navInstr.innerHTML=nm.text;
    var ns=null; for(var s=0;s<stopProj.length;s++){ if(stopProj[s].cum>travelled+40){ ns=stopProj[s]; break; } }
    var eta=Math.round(remaining/1000/SPEED_KMH*60);
    navSub.textContent=fmt(remaining)+' left · ~'+eta+' min'+(ns?' · next: '+ns.name:'');
    if(voiceOn && nmIdx>=0){
      if(dNext<=170 && dNext>55 && !preSpoken.has(nmIdx)){ preSpoken.add(nmIdx); speak('In '+(Math.round(dNext/10)*10)+' meters, '+nm.text); }
      if(dNext<=45 && !finSpoken.has(nmIdx)){ finSpoken.add(nmIdx); speak(nm.text); }
    }
  }
  function onPos(e){
    var ll=[e.coords.latitude, e.coords.longitude];
    if(!meDot){ meDot=L.marker(ll,{icon:meIcon,zIndexOffset:1000}).addTo(map);
      meAcc=L.circle(ll,{radius:e.coords.accuracy,color:'#1c7ed6',weight:1,fillOpacity:.08}).addTo(map); }
    else { meDot.setLatLng(ll); meAcc.setLatLng(ll).setRadius(e.coords.accuracy); }
    updateNav(ll, e.coords.accuracy);
    if(following) map.setView(ll, navZoom(), {animate:true});
  }
  function onErr(err){ nav.classList.add('show'); setControlsTop(118); navIcon.innerHTML='&#9888;';
    navDist.textContent='GPS'; navInstr.textContent='Location unavailable'; navSub.textContent=err.message; }
  function startWatch(){ if(!('geolocation' in navigator)){ onErr({message:'Geolocation not supported on this device.'}); return; }
    if(watchId===null) watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
    acquireWake(); }

  locateBtn.addEventListener('click', function(){
    startWatch(); following=!following; locateBtn.classList.toggle('follow',following);
    locateBtn.innerHTML=following?'&#10148;':'&#9678;';
    if(following&&meDot) map.setView(meDot.getLatLng(), Math.max(map.getZoom(),16));
  });
  map.on('dragstart', function(){ if(following){ following=false; locateBtn.classList.remove('follow'); locateBtn.innerHTML='&#9678;'; }});
  // Live updates start automatically; follow mode engages on the first fix.
  following=true; locateBtn.classList.add('follow'); locateBtn.innerHTML='&#10148;';
  startWatch();
})();
</script>
</body>
</html>
